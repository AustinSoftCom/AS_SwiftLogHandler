name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Linux support would require gating Destination.SQLFile's `import SQLite3`
  # (no such module on Linux). Until then, this package is Apple-platforms only.
  #
  # linux:
  #   name: Linux (Swift ${{ matrix.swift }})
