name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.3 is the minimum declared by swift-tools-version; also test the
        # latest release. Bump these as new toolchains ship.
        swift: ["6.3", "6.4"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v6
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  macos:
    name: macOS (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test

  # Windows support is unverified. To try it, uncomment this job — it will
  # surface any platform-specific compilation issues.
