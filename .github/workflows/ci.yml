  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       swift: ["6.3"]
  #   container: swift:${{ matrix.swift }}
  #   steps:
  #     - uses: actions/checkout@v6
  #     - name: Build
  #       run: swift build --build-tests
  #     - name: Test
  #       run: swift test

  macos:
    name: macOS (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test

  # Windows support is unverified. To try it, uncomment this job — it will
  # surface any platform-specific compilation issues.
